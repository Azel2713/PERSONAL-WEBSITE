<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>September 2026 Calendar</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: #eef6ff;
            color: #183451;
            font-family: Arial, sans-serif;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 28px;
            background: #ffffff;
            border: 1px solid #d5e6f7;
            border-radius: 18px;
            box-shadow: 0 12px 32px rgba(31, 91, 145, 0.12);
        }

        h1 {
            margin: 0;
            color: #145da0;
            font-size: 2rem;
        }

        .subtitle {
            margin: 8px 0 24px;
            color: #63809b;
        }

        .calendar-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 620px;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 6px;
        }

        th {
            padding: 12px 6px;
            border-radius: 8px;
            background: #1769aa;
            color: #ffffff;
            font-size: 0.9rem;
        }

        td {
            height: 112px;
            padding: 10px;
            vertical-align: top;
            border: 1px solid #d9e9f7;
            border-radius: 10px;
            background: #f7fbff;
            font-weight: 600;
        }

        td.empty {
            background: #f0f6fc;
            border-color: #e8f0f8;
        }

        .date {
            display: block;
            margin-bottom: 7px;
            color: #245b8f;
        }

        .photo-link {
            display: block;
            overflow: hidden;
            height: 65px;
            border-radius: 7px;
        }

        .photo-link img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 10px;
            }

            main {
                padding: 18px 12px;
            }

            h1 {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>September 2026</h1>
        <p class="subtitle">A fresh month, ready for new plans.</p>
        <div class="calendar-wrap">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Sunday</th>
                        <th scope="col">Monday</th>
                        <th scope="col">Tuesday</th>
                        <th scope="col">Wednesday</th>
                        <th scope="col">Thursday</th>
                        <th scope="col">Friday</th>
                        <th scope="col">Saturday</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="empty"></td>
                        <td class="empty"></td>
                        <td><span class="date">1</span></td>
                        <td><span class="date">2</span></td>
                        <td><span class="date">3</span></td>
                        <td><span class="date">4</span></td>
                        <td><span class="date">5</span></td>
                    </tr>
                    <tr>
                        <td><span class="date">6</span></td>
                        <td><span class="date">7</span></td>
                        <td><span class="date">8</span></td>
                        <td><span class="date">9</span></td>
                        <td><span class="date">10</span></td>
                        <td><span class="date">11</span></td>
                        <td><span class="date">12</span></td>
                    </tr>
                    <tr>
                        <td><span class="date">13</span></td>
                        <td><span class="date">14</span></td>
                        <td><span class="date">15</span></td>
                        <td><span class="date">16</span></td>
                        <td><span class="date">17</span></td>
                        <td><span class="date">18</span></td>
                        <td><span class="date">19</span></td>
                    </tr>
                    <tr>
                        <td><span class="date">20</span></td>
                        <td><span class="date">21</span></td>
                        <td><span class="date">22</span></td>
                        <td><span class="date">23</span></td>
                        <td><span class="date">24</span></td>
                        <td><span class="date">25</span></td>
                        <td><span class="date">26</span></td>
                    </tr>
                    <tr>
                        <td><span class="date">27</span></td>
                        <td><span class="date">28</span></td>
                        <td><span class="date">29</span></td>
                        <td>
                            <span class="date">30</span>
                            <a class="photo-link"
                               href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDuQox8ymXGUFKRcWrwRc6HwrhcNjmLh8V-suQCitXVw&s=10"
                               target="_blank" rel="noopener">
                                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDuQox8ymXGUFKRcWrwRc6HwrhcNjmLh8V-suQCitXVw&amp;s=10"
                                     alt="Nailong, the yellow cartoon dinosaur; click to enlarge">
                            </a>
                        </td>
                        <td class="empty"></td>
                        <td class="empty"></td>
                        <td class="empty"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
